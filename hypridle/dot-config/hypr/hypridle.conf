general {
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl reload
}

listener {
    timeout    = 300 # 5 min
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r          # restore previous state
}

listener {
    timeout    = 600 # 10 min
    on-timeout = loginctl lock-session
}

