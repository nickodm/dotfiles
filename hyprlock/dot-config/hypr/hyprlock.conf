
$font = Meslo

##########
# COLORS
##########

$gray = rgba(333333ff)
$blue = rgba(1e78e4ff)
$red  = rgba(c01c28ff)

$transparent = rgba(0, 0, 0, 0)

##########
# CONFIG
##########

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 1000
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

##########
# WIDGETS
##########

background {
    monitor =
    path = ~/images/wallpaper.png
    blur_passes = 1
}


input-field {
    monitor =
    size = 300, 50
    inner_color = rgba(333333aa)

    outline_thickness = 2
    outer_color = $transparent

    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Enter Password
    fail_text = $PAMFAIL

    dots_size = 0.2
    dots_spacing = 0.3

    hide_input = true
    hide_input_base_color = $blue

    position = 0, 0
}

# TIME
label {
    monitor =
    text = <b>$TIME</b>
    font_size = 90
    font_family = $font

    position = 0, 25%
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%a, %d %B %Y" # update every 60 seconds
    font_size = 25

    position = 0%, 15%
 }

label {
    monitor =
    text =   $DESC
    position = 0%, 5%
}
